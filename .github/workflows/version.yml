name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validateur officiel de plugins, catalogue puis plugin et ses skills
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          mkdir -p /tmp/plugin && cp -r .claude-plugin skills /tmp/plugin/ && rm /tmp/plugin/.claude-plugin/marketplace.json
          claude plugin validate --strict /tmp/plugin
      - name: Bibliothèques du moteur de visuels
        run: python -m pip install reportlab pillow pypdf
      - name: Contrôle de la mallette
        run: python skills/immo-init/scripts/verifier-mallette.py skills --moteur || test $? -eq 1
      - name: Versions conformes à l'étiquette
        run: python .github/scripts/versions.py --verifier --etiquette "${GITHUB_REF_NAME}"
      - name: Fabriquer les cinq ZIP
        run: python .github/scripts/empaqueter.py dist
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "Mallette ${GITHUB_REF_NAME}" --notes-file dist/notes.md
