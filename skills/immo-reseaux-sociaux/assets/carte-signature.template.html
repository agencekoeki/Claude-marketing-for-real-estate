<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte signature</title>
<!-- ═══ IDENTITÉ — mêmes valeurs que les autres gabarits, dans 00_MOI/cadre.md ═══ -->
<style>
:root{
  --dominante:#14213D;   /* [SA COULEUR PRINCIPALE] */
  --accent:#7A2E3B;      /* [SA COULEUR D'ACCENT] */
  --carte:#FFF;--trait:#A8B2C0;--gris:#5A6678;
}
*{box-sizing:border-box}
body{margin:0;background:#D7DCE3;font-family:"Inter","Segoe UI",Roboto,-apple-system,Arial,sans-serif;color:var(--dominante);display:flex;justify-content:center;padding:1.5rem}
/* 1080 x 1350 — le portrait, le plus performant dans un fil */
.c{width:1080px;max-width:100%;aspect-ratio:4/5;background:var(--carte);padding:6%;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
/* le bandeau d'accent : c'est lui qui rend la carte reconnaissable d'une fois sur l'autre */
.c:before{content:"";position:absolute;left:0;top:0;width:100%;height:10px;background:var(--accent)}
.c h1{font-size:2.7em;line-height:1.18;font-weight:650;letter-spacing:-.02em;margin:.4em 0 0;max-width:15em}
.c h1 em{font-style:normal;color:var(--accent)}
.sig{display:flex;align-items:center;gap:1em;border-top:2px solid var(--trait);padding-top:1em}
.sig img{width:5.2em;height:5.2em;border-radius:50%;object-fit:cover;flex:none;background:var(--trait)}
.sig b{display:block;font-size:1.25em;font-weight:650;line-height:1.2}
.sig span{display:block;font-size:1em;color:var(--gris)}
.src{font-size:.85em;color:var(--gris);margin-top:.5em}
@media print{body{background:#fff;padding:0}}
</style></head><body>

<div class="c">

  <!-- Une phrase. Pas deux. Le mot ou le groupe de mots qui porte va dans <em>.
       C'est l'un des deux seuls endroits où l'USP s'écrit telle quelle — sous forme d'un
       comportement de sa section 4, pas de la phrase : « Je rappelle le soir même. » -->
  <h1>[LA PHRASE, COURTE — LE MOT QUI PORTE EN <em>ACCENT</em>]</h1>

  <div>
    <!-- Sa photo, la même que partout ailleurs. S'il n'en a pas, retirer la balise img :
         la carte fonctionne sans, et une mauvaise photo vaut moins que pas de photo. -->
    <div class="sig">
      <img src="[CHEMIN DE SA PHOTO]" alt="">
      <div>
        <b>[SON NOM]</b>
        <span>[SON MÉTIER] · [SA COMMUNE]</span>
      </div>
    </div>
    <p class="src">[SOURCE ET DATE, SI UN CHIFFRE FIGURE — SINON SUPPRIMER CETTE LIGNE]</p>
  </div>

</div>

</body></html>
